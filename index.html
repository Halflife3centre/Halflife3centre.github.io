<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Half Life 3 Centre</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* --- INTRO-ANIMATION (DEL 1) --- */
        .intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            animation: hideIntro 0.1s linear forwards;
            animation-delay: 4.2s; /* Döljer intro-skärmen efter animationen */
        }

        .intro-container {
            text-align: center;
            position: absolute;
            opacity: 0;
            animation: fadeInOut 2.5s ease forwards;
        }

        .intro-logo {
            max-width: 80vw;
            max-height: 60vh;
            height: auto;
        }

        .welcome-container {
            position: absolute;
            text-align: center;
            font-size: 2.2rem;
            font-weight: bold;
            color: #ffffff;
            opacity: 0;
            animation: fadeInText 1.5s ease forwards;
            animation-delay: 2.6s;
        }

        .welcome-container span {
            color: #ff6600;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: scale(0.95); }
            30% { opacity: 1; transform: scale(1); }
            70% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.05); }
        }

        @keyframes fadeInText {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes hideIntro {
            to { display: none; visibility: hidden; pointer-events: none; }
        }


        /* --- STARTSIDA / HERO-SEKTION (GTAVICENTRE STIL) --- */
        .hero-section {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Den gröna rutan som agerar bakgrundsbild */
        .hero-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1b4332; /* Grön ruta */
            background-size: cover;
            background-position: center;
            transition: transform 0.1s ease-out; /* Mjuk förstoring */
            will-change: transform;
            z-index: 1;
        }

        /* Mörk skugga/toning över bakgrunden så text/logga syns bättre */
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 2;
        }

        /* Loggan i mitten som står still medan bakgrunden förstoras */
        .hero-logo {
            position: relative;
            z-index: 3;
            text-align: center;
            font-size: 3.5rem;
            font-weight: bold;
            color: #ff6600;
            text-transform: uppercase;
            letter-spacing: 4px;
            border: 4px solid #ff6600;
            padding: 20px 40px;
            background-color: rgba(0, 0, 0, 0.6);
        }

        /* Indikator längst ner som tipsar om att skrolla */
        .scroll-hint {
            position: absolute;
            bottom: 30px;
            z-index: 3;
            font-size: 1rem;
            color: #cccccc;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Secon d sektion nedanför så du kan skrolla */
        .content-section {
            position: relative;
            z-index: 10;
            background-color: #121212;
            padding: 80px 20px;
            min-height: 100vh;
            text-align: center;
        }

        .content-section h2 {
            color: #ff6600;
            font-size: 2.5rem;
        }
    </style>
</head>
<body>

    <!-- INTROANIMATIONEN -->
    <div class="intro-screen">
        <div class="intro-container">
            <img src="5512.png" alt="Half Life 3 Centre Logo" class="intro-logo">
        </div>
        <div class="welcome-container">
            Welcome to <span>Half life 3 Centre!</span>
        </div>
    </div>

    <!-- DEL 1 AV STARTSIDAN (HERO) -->
    <section class="hero-section">
        <div class="hero-background" id="heroBg"></div>
        <div class="hero-overlay"></div>
        
        <div class="hero-logo">
            HL3 LOGO
        </div>

        <div class="scroll-hint">
            Skrolla ner ↓
        </div>
    </section>

    <!-- INNEHÅLLSKORT NÄR MAN SKROLLAR NER -->
    <section class="content-section">
        <h2>Senaste nyheterna om Half-Life 3</h2>
        <p>Här kommer nyhetsflödet, rykten och analyser att ligga!</p>
    </section>

    <!-- JAVASCRIPT FÖR FÖRSTORINGSEFFEKTEN NÄR MAN SKROLLAR -->
    <script>
        const heroBg = document.getElementById('heroBg');

        window.addEventListener('scroll', () => {
            const scrollPosition = window.scrollY;
            // Förstorar bakgrunden stegvis från 1.0 upp till ca 1.25 när man skrollar
            const scaleValue = 1 + (scrollPosition / 2000);
            
            if (scrollPosition < 1000) {
                heroBg.style.transform = `scale(${scaleValue})`;
            }
        });
    </script>

</body>
</html>
