<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Half Life 3 Centre</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ff6600;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Första animationen (Logotyp-bilden) */
        .intro-container {
            text-align: center;
            position: absolute;
            opacity: 0;
            animation: fadeInOut 2.5s ease forwards;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .intro-logo {
            max-width: 80vw;
            max-height: 60vh;
            height: auto;
            width: auto;
        }

        /* Andra animationen (Welcome text) */
        .welcome-container {
            position: absolute;
            text-align: center;
            font-size: 2.2rem;
            font-weight: bold;
            color: #ffffff;
            opacity: 0;
            animation: fadeInText 1.5s ease forwards;
            animation-delay: 2.6s; /* Startar direkt efter att den första fadear ut */
        }

        .welcome-container span {
            color: #ff6600;
        }

        /* Keyframes för fade in och ut */
        @keyframes fadeInOut {
            0% { opacity: 0; transform: scale(0.95); }
            30% { opacity: 1; transform: scale(1); }
            70% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.05); }
        }

        @keyframes fadeInText {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Första sekvensen (Din logotyp) -->
    <div class="intro-container">
        <img src="5512.png" alt="Half Life 3 Centre Logo" class="intro-logo">
    </div>

    <!-- Andra sekvensen -->
    <div class="welcome-container">
        Welcome to <span>Half life 3 Centre!</span>
    </div>

</body>
</html>
