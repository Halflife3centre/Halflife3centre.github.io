<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Half Life 3 Centre</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        /* --- INTRO-ANIMATION --- */
        .intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 9999;
            animation: fadeOutIntro 0.5s ease forwards;
            animation-delay: 4.0s;
        }

        .intro-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            opacity: 0;
            animation: fadeInOut 2.5s ease forwards;
        }

        .intro-logo {
            max-width: 80vw;
            max-height: 50vh;
            height: auto;
            width: auto;
        }

        .welcome-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            text-align: center;
            font-size: 2.2rem;
            font-weight: bold;
            color: #ffffff;
            opacity: 0;
            animation: fadeInText 1.5s ease forwards;
            animation-delay: 2.5s;
        }

        .welcome-container span {
            color: #ff6600;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }
            30% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            70% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.05); }
        }

        @keyframes fadeInText {
            0% { opacity: 0; transform: translate(-50%, calc(-50% + 10px)); }
            100% { opacity: 1; transform: translate(-50%, -50%); }
        }

        @keyframes fadeOutIntro {
            to {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
            }
        }

        /* --- STARTSIDA / HERO-SEKTION --- */
        .hero-section {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('5516.jpg');
            background-size: cover;
            background-position: center;
            transition: transform 0.1s ease-out;
            will-change: transform;
            z-index: 1;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1) 60%, rgba(0,0,0,0.6) 100%);
            z-index: 2;
        }

        .hero-logo-container {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
        }

        .hero-logo-img {
            max-width: 320px;
            width: 75vw;
            height: auto;
            filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.9));
        }

        .scroll-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            font-size: 1rem;
            color: #cccccc;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        /* --- INNEHÅLLSDEL SOM OVERGÅR TILL HELORANGE --- */
        .content-section {
            position: relative;
            z-index: 10;
            background: linear-gradient(to bottom, 
                #22252a 0%, 
                #1a120c 25%, 
                #5e2303 55%, 
                #a33a00 80%, 
                #ff6600 100%
            );
            padding: 120px 20px 100px 20px;
            min-height: 100vh;
            text-align: center;
        }

        .content-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 160px;
            background: linear-gradient(to bottom, rgba(40, 44, 50, 0.9) 0%, rgba(20, 15, 12, 0.5) 50%, transparent 100%);
            pointer-events: none;
            z-index: 2;
        }

        .content-section h2 {
            position: relative;
            z-index: 3;
            color: #ffffff;
            font-size: 2.5rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.6);
        }

        .content-section p {
            position: relative;
            z-index: 3;
            color: #e0e0e0;
            font-size: 1.1rem;
        }

        /* --- HELORANGE SIDFOT (FOOTER) --- */
        .site-footer {
            background-color: #ff6600;
            color: #000000;
            padding: 40px 20px 60px 20px;
            position: relative;
            z-index: 10;
            border-top: 2px solid rgba(0, 0, 0, 0.1);
        }

        .footer-masthead {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 30px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.2);
        }

        .footer-brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .footer-logo-box {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ff6600;
            background-color: #000000;
            padding: 8px 14px;
            border-radius: 4px;
            letter-spacing: 1px;
            line-height: 1;
        }

        .footer-title-group h3 {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 800;
            color: #000000;
        }

        .footer-title-group p {
            margin: 3px 0 0 0;
            font-size: 0.9rem;
            color: rgba(0, 0, 0, 0.7);
        }

        .back-to-top {
            background-color: #000000;
            color: #ffffff;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .back-to-top:hover {
            transform: translateY(-3px);
            background-color: #1a1a1a;
        }
    </style>
</head>
<body>

    <!-- INTROANIMATIONEN -->
    <div class="intro-screen">
        <div class="intro-container">
            <img src="5512.png" alt="Half Life 3 Centre Logo" class="intro-logo">
        </div>
        <div class="welcome-container">
            Welcome to <span>Half life 3 Centre!</span>
        </div>
    </div>

    <!-- STARTSIDANS FÖRSTA DEL (HERO) -->
    <section class="hero-section">
        <div class="hero-background" id="heroBg"></div>
        <div class="hero-overlay"></div>
        
        <div class="hero-logo-container">
            <img src="5512.png" alt="Half Life 3 Centre Logo" class="hero-logo-img">
        </div>

        <div class="scroll-hint">
            Skrolla ner ↓
        </div>
    </section>

    <!-- NÄSTA DEL AV SIDAN -->
    <section class="content-section">
        <h2>Latest news about Half-Life 3</h2>
        <p>Här kommer nyhetsflödet och uppdateringarna att ligga!</p>
    </section>

    <!-- HELORANGE SIDFOT -->
    <footer class="site-footer">
        <div class="footer-masthead">
            <div class="footer-brand">
                <div class="footer-logo-box">HL3</div>
                <div class="footer-title-group">
                    <h3>Half-Life 3 Centre</h3>
                    <p>News and community.</p>
                </div>
            </div>

            <button class="back-to-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" aria-label="Till toppen">
                ↑
            </button>
        </div>
    </footer>

    <!-- SCRIPT FÖR ATT FÖRSTORA BAKGRUNDEN VID SKROLL -->
    <script>
        const heroBg = document.getElementById('heroBg');

        window.addEventListener('scroll', () => {
            const scrollPosition = window.scrollY;
            const scaleValue = 1 + (scrollPosition / 2000);
            
            if (scrollPosition < 1000) {
                heroBg.style.transform = `scale(${scaleValue})`;
            }
        });
    </script>

</body>
</html>
