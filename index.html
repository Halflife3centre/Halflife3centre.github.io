<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Half Life 3 Centre</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        /* --- INTRO-ANIMATION --- */
        .intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 9999;
            animation: fadeOutIntro 0.5s ease forwards;
            animation-delay: 4.0s;
        }

        .intro-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            opacity: 0;
            animation: fadeInOut 2.5s ease forwards;
        }

        .intro-logo {
            max-width: 80vw;
            max-height: 50vh;
            height: auto;
            width: auto;
        }

        .welcome-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            text-align: center;
            font-size: 2.2rem;
            font-weight: bold;
            color: #ffffff;
            opacity: 0;
            animation: fadeInText 1.5s ease forwards;
            animation-delay: 2.5s;
        }

        .welcome-container span {
            color: #ff6600;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }
            30% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            70% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.05); }
        }

        @keyframes fadeInText {
            0% { opacity: 0; transform: translate(-50%, calc(-50% + 10px)); }
            100% { opacity: 1; transform: translate(-50%, -50%); }
        }

        @keyframes fadeOutIntro {
            to {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
            }
        }

        /* --- STARTSIDA / HERO-SEKTION --- */
        .hero-section {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('5516.jpg');[cite: 5]
            background-size: cover;
            background-position: center;
            transition: transform 0.1s ease-out;
            will-change: transform;
            z-index: 1;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1) 60%, rgba(0,0,0,0.6) 100%);
            z-index: 2;
        }

        /* Vitt ambient sken längst ner som sträcker sig nedåt */
        .hero-section::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 130px;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.35) 60%, rgba(255, 255, 255, 0.75) 100%);
            pointer-events: none;
            z-index: 4;
        }

        .hero-logo-container {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
        }

        .hero-logo-img {
            max-width: 320px;
            width: 75vw;
            height: auto;
            filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.9));
        }

        .scroll-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            font-size: 1rem;
            color: #cccccc;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        /* --- INNEHÅLLSKONTROLL MED GRADIENT --- */
        .content-section {
            position: relative;
            z-index: 10;
            background: linear-gradient(to bottom, 
                #1a1a1a 0%, 
                #2a1608 30%, 
                #5e2303 65%, 
                #a33a00 88%, 
                #ff6600 100%
            );
            padding: 100px 20px;
            min-height: 120vh;
            text-align: center;
        }

        .content-section h2 {
            color: #ffffff;
            font-size: 2.5rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.6);
        }

        .content-section p {
            color: #e0e0e0;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <!-- INTROANIMATIONEN -->
    <div class="intro-screen">
        <div class="intro-container">
            <img src="5512.png" alt="Half Life 3 Centre Logo" class="intro-logo">[cite: 1]
        </div>
        <div class="welcome-container">
            Welcome to <span>Half life 3 Centre!</span>
        </div>
    </div>

    <!-- STARTSIDANS FÖRSTA DEL (HERO) -->
    <section class="hero-section">
        <div class="hero-background" id="heroBg"></div>
        <div class="hero-overlay"></div>
        
        <div class="hero-logo-container">
            <img src="5512.png" alt="Half Life 3 Centre Logo" class="hero-logo-img">[cite: 1]
        </div>

        <div class="scroll-hint">
            Skrolla ner ↓
        </div>
    </section>

    <!-- NÄSTA DEL AV SIDAN -->
    <section class="content-section">
        <h2>Latest news about Half-Life 3</h2>
        <p>Här kommer nyhetsflödet och uppdateringarna att ligga!</p>
    </section>

    <!-- SCRIPT FÖR ATT FÖRSTORA BAKGRUNDEN VID SKROLL -->
    <script>
        const heroBg = document.getElementById('heroBg');

        window.addEventListener('scroll', () => {
            const scrollPosition = window.scrollY;
            const scaleValue = 1 + (scrollPosition / 2000);
            
            if (scrollPosition < 1000) {
                heroBg.style.transform = `scale(${scaleValue})`;
            }
        });
    </script>

</body>
</html>
