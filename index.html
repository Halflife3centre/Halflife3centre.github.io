<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Half Life 3 Centre</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ff6600;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Första animationen (Half life 3 / CENTRE) */
        .intro-container {
            text-align: center;
            position: absolute;
            opacity: 0;
            animation: fadeInOut 2.5s ease forwards;
        }

        .title-hl3 {
            font-size: 3.5rem;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .title-centre {
            font-size: 1.5rem;
            letter-spacing: 10px;
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* Andra animationen (Welcome text) */
        .welcome-container {
            position: absolute;
            text-align: center;
            font-size: 2.2rem;
            font-weight: bold;
            color: #ffffff;
            opacity: 0;
            animation: fadeInText 1.5s ease forwards;
            animation-delay: 2.6s; /* Startar direkt efter att den första fadear ut */
        }

        .welcome-container span {
            color: #ff6600;
        }

        /* Keyframes för fade in och ut */
        @keyframes fadeInOut {
            0% { opacity: 0; transform: scale(0.95); }
            30% { opacity: 1; transform: scale(1); }
            70% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.05); }
        }

        @keyframes fadeInText {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Första sekvensen -->
    <div class="intro-container">
        <div class="title-hl3">Half life 3</div>
        <div class="title-centre">CENTRE</div>
    </div>

    <!-- Andra sekvensen -->
    <div class="welcome-container">
        Welcome to <span>Half life 3 Centre!</span>
    </div>

</body>
</html>
